<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Prices - Luxtronic Portal NEO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="pricepages.css">
    <link rel="icon" type="image/png" href="icons/luxtronic.png">
    <script>
        try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode'); } catch {}
    </script>
</head>
<body>
    <header class="header">
        <a class="brand" href="/" title="Back to portal">
            <span class="logo-box"><img src="icons/luxtronic.png" alt="Luxtronic"></span>
            <span class="brand-name">Luxtronic Portal</span>
            <span class="tagline"><i class="fas fa-chevron-right"></i> Fuel Prices</span>
        </a>
        <div class="header-actions">
            <a class="header-link" href="/" title="Back to portal" aria-label="Back to portal"><i class="fas fa-house"></i></a>
            <button id="darkModeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
                <i id="themeIcon" class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="page">
        <section class="box">
            <div class="box-title toolbar-row">
                <span><i class="fas fa-gas-pump"></i> Cheapest fuel today</span>
                <span class="updated-wrap">
                    <span id="updated-label" class="updated-label"></span>
                    <button id="refresh-btn" class="text-btn" type="button"><i class="fas fa-rotate"></i> Refresh</button>
                </span>
            </div>
            <div id="region-chips" class="chips" role="tablist" aria-label="Region"></div>
            <div id="status" class="status-message">Loading fuel prices&hellip;</div>
            <div id="fuel-grid" class="fuel-grid"></div>
            <p class="source-note">Prices in cents per litre. Source: <a href="https://projectzerothree.info" target="_blank" rel="noopener noreferrer">projectzerothree.info</a>, refreshed by the portal every 15 minutes.</p>
        </section>
    </main>

    <script src="theme.js" defer></script>
    <script src="fuel.js" defer></script>
</body>
</html>
