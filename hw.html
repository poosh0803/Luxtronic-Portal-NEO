<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HW Price - Luxtronic Portal NEO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="pricepages.css">
    <link rel="icon" type="image/png" href="icons/luxtronic.png">
    <script>
        try { if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark-mode'); } catch {}
    </script>
</head>
<body>
    <header class="header">
        <a class="brand" href="/" title="Back to portal">
            <span class="logo-box"><img src="icons/luxtronic.png" alt="Luxtronic"></span>
            <span class="brand-name">Luxtronic Portal</span>
            <span class="tagline"><i class="fas fa-chevron-right"></i> HW Price</span>
        </a>
        <div class="header-actions">
            <a class="header-link" href="/" title="Back to portal" aria-label="Back to portal"><i class="fas fa-house"></i></a>
            <button id="darkModeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
                <i id="themeIcon" class="fas fa-moon"></i>
            </button>
        </div>
    </header>

    <main class="page">
        <section class="box">
            <div class="box-title toolbar-row">
                <span><i class="fas fa-microchip"></i> Hardware prices</span>
                <span class="updated-wrap">
                    <span id="updated-label" class="updated-label"></span>
                    <button id="refresh-btn" class="text-btn" type="button"><i class="fas fa-rotate"></i> Refresh</button>
                </span>
            </div>
            <div id="tabs" class="chips" role="tablist" aria-label="Category"></div>
            <div class="search-row">
                <input type="search" id="search-input" placeholder="Search…" autocomplete="off">
            </div>
            <div id="filters"></div>
            <div id="count-label" class="count-label"></div>
            <div id="status" class="status-message">Loading&hellip;</div>
            <div class="table-wrap"><div id="hw-table"></div></div>
            <p class="source-note">Prices from <a href="https://www.pgrid.app/au" target="_blank" rel="noopener noreferrer">PGrid Australia</a>, collected by the portal and refreshed hourly. Click a row to open it on PGrid.</p>
        </section>
    </main>

    <script src="theme.js" defer></script>
    <script src="hw.js" defer></script>
</body>
</html>
